{% extends "base.html" %}
{% block title %}New Journal Entry &middot; MiniSuite{% endblock %}
{% block content %}
<div class="toolbar">
  <h1>New Journal Entry</h1>
  <a class="btn secondary" href="/ui/journalEntries">Cancel</a>
</div>

<div class="panel">
  <form id="je-form" onsubmit="event.preventDefault(); submitJE();">
    <div class="row" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem">
      <div><label>tranId (optional)</label><input id="tranId" type="text" placeholder="auto" /></div>
      <div><label>Date *</label><input id="tranDate" type="date" value="2026-04-30" required /></div>
      <div><label>Reversal date</label><input id="reversalDate" type="date" value="2026-05-01" /></div>
    </div>
    <div class="row"><label>Memo</label><input id="memo" type="text" value="April 2026 freight accrual" /></div>

    <h2>Lines</h2>
    <table class="lines">
      <thead>
        <tr>
          <th style="width:30%">Account</th>
          <th style="width:18%">Vendor</th>
          <th>Memo</th>
          <th class="num" style="width:12%">Debit</th>
          <th class="num" style="width:12%">Credit</th>
          <th style="width:32px"></th>
        </tr>
      </thead>
      <tbody id="lines"></tbody>
    </table>
    <p style="margin-top:0.5rem"><button type="button" class="btn secondary" onclick="addLine()">+ Add line</button></p>

    <div class="balance">
      <span>Debits: <span id="totDebit">$0.00</span></span>
      <span>Credits: <span id="totCredit">$0.00</span></span>
      <span id="balStatus" class="bad">Unbalanced</span>
    </div>

    <div id="msg"></div>
    <p><button type="submit" class="btn">Post Journal Entry</button></p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const ACCOUNTS = [
  {% for a in accounts %}{ id: "{{ a.id }}", label: "{{ a.acctNumber }} · {{ a.acctName }}" },
  {% endfor %}
];
const VENDORS = [
  {% for v in vendors %}{ id: "{{ v.id }}", label: "{{ v.entityId }}" },
  {% endfor %}
];

function accountOptions(selectedId) {
  return ACCOUNTS.map(a => `<option value="${a.id}" ${a.id === selectedId ? "selected" : ""}>${a.label}</option>`).join("");
}
function vendorOptions(selectedId) {
  return '<option value="">—</option>' + VENDORS.map(v => `<option value="${v.id}" ${v.id === selectedId ? "selected" : ""}>${v.label}</option>`).join("");
}

function addLine(presetAccountId, presetVendorId, debit, credit, memo) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><select class="acct" required>${accountOptions(presetAccountId || "")}</select></td>
    <td><select class="vend">${vendorOptions(presetVendorId || "")}</select></td>
    <td><input class="memo" type="text" value="${memo||""}" /></td>
    <td><input class="debit" type="number" step="0.01" min="0" value="${debit||""}" oninput="updateBalance()" /></td>
    <td><input class="credit" type="number" step="0.01" min="0" value="${credit||""}" oninput="updateBalance()" /></td>
    <td><button type="button" class="btn danger" style="padding:0.25rem 0.5rem" onclick="this.closest('tr').remove(); updateBalance();">&times;</button></td>
  `;
  document.getElementById("lines").appendChild(tr);
  updateBalance();
}

function updateBalance() {
  let d = 0, c = 0;
  document.querySelectorAll("#lines tr").forEach(tr => {
    const dv = parseFloat(tr.querySelector(".debit").value || 0);
    const cv = parseFloat(tr.querySelector(".credit").value || 0);
    if (!isNaN(dv)) d += dv;
    if (!isNaN(cv)) c += cv;
  });
  document.getElementById("totDebit").textContent = "$" + d.toFixed(2);
  document.getElementById("totCredit").textContent = "$" + c.toFixed(2);
  const s = document.getElementById("balStatus");
  if (Math.abs(d - c) < 0.01 && d > 0) { s.textContent = "Balanced ✓"; s.className = "ok"; }
  else { s.textContent = "Unbalanced (Δ $" + (d - c).toFixed(2) + ")"; s.className = "bad"; }
}

async function submitJE() {
  const lines = [];
  document.querySelectorAll("#lines tr").forEach((tr, i) => {
    const acct = tr.querySelector(".acct").value;
    const vend = tr.querySelector(".vend").value;
    const memo = tr.querySelector(".memo").value;
    const d = tr.querySelector(".debit").value;
    const c = tr.querySelector(".credit").value;
    const line = { line: i + 1, account: { id: acct }, memo };
    if (d) line.debit = parseFloat(d);
    if (c) line.credit = parseFloat(c);
    if (vend) line.entity = { id: vend };
    lines.push(line);
  });
  const body = {
    tranId: document.getElementById("tranId").value || undefined,
    tranDate: document.getElementById("tranDate").value,
    memo: document.getElementById("memo").value,
    reversalDate: document.getElementById("reversalDate").value || undefined,
    line: { items: lines },
  };
  const r = await window.MINISUITE.api("POST", "/services/rest/record/v1/journalEntry", body);
  if (r.ok) {
    const loc = r.headers.get("Location");
    const id = loc ? loc.split("/").pop() : "";
    window.location.href = "/ui/journalEntries/" + id;
  } else {
    document.getElementById("msg").innerHTML = '<div class="err">' + JSON.stringify(r.body, null, 2) + '</div>';
  }
}

// Pre-fill with the demo accrual JE: Dr 6011 (Freight Expense) / Cr 2011 (Accrued Freight).
const freight = ACCOUNTS.find(a => a.label.startsWith("6011"));
const accrued = ACCOUNTS.find(a => a.label.startsWith("2011"));
addLine(freight && freight.id, "", 90000, "", "April freight accrual");
addLine(accrued && accrued.id, "", "", 90000, "Accrued freight payable");
</script>
{% endblock %}
